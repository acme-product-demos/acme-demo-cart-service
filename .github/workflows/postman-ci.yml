name: Postman CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  postman-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install service dependencies
        run: npm ci
      - name: Install Postman CLI
        run: npm install -g postman-cli
      - name: Authenticate Postman CLI
        run: postman login --with-api-key "${{ secrets.POSTMAN_API_KEY }}"
      - name: Start service in background
        env:
          # This job only starts cart-service itself. Point its cross-service
          # calls at the deployed public mocks so enrichment/checkout work in
          # CI instead of hitting an unreachable localhost.
          PRODUCT_SERVICE_URL: https://product-service-mock.mock.product-demos.postman.dev
          ORDER_SERVICE_URL: https://order-service-mock.mock.product-demos.postman.dev
          INVENTORY_SERVICE_URL: https://inventory-service-mock-b08713.mock.product-demos.postman.dev
          PAYMENT_SERVICE_URL: https://payment-service-mock-cfa754.mock.product-demos.postman.dev
          MOCK_SESSION_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: nohup npm start > server.log 2>&1 &
      - name: Wait for service to be healthy
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4002/health && exit 0
            sleep 1
          done
          echo "Service never became healthy"; cat server.log; exit 1
      - name: Spec lint (governance)
        run: postman spec lint postman/specs/cart-service/index.yaml --workspace-id 52c2bad9-bbaa-4aa1-abe9-07d3baf4907c -f error
      - name: Collection lint (structure/style)
        run: postman collection lint "postman/collections/Cart Service API" -f error
      - name: Collection run (live contract test)
        # Scoped to the pre-existing requests: the two "Rejects Unexpected
        # Field" negative tests exercise validation that only the mock has
        # (see the step below) -- the real service was intentionally left
        # unchanged.
        run: postman collection run "postman/collections/Cart Service API" -e postman/environments/cart-service-local.environment.yaml -i "Reset Cart" -i "Checkout Empty Cart" -i "Add Headphones" -i "Add Coffee Set" -i "View Cart" -i "Update Headphones Quantity" -i "Remove Coffee Set" -i "Checkout" -i "View Cart After Checkout"
      - name: Contract test against deployed mock (publisher-driven)
        # Deployed mocks run multiple non-sticky instances with no shared
        # memory (confirmed separately), so the full multi-step cart/
        # checkout flow flakes against them through no fault of the mock's
        # contract. Scoped to the self-contained negative tests instead:
        # each is a single request with no cross-request state dependency,
        # so it's a reliable gate that a bad body still gets rejected by
        # whatever's actually deployed, not just by the local mock.
        run: postman collection run "postman/collections/Cart Service API" -e postman/environments/cart-service-mock.environment.yaml --env-var "mockSessionId=ci-${{ github.run_id }}-${{ github.run_attempt }}" -i "Add Item Rejects Unexpected Field" -i "Set Quantity Rejects Unexpected Field"
      - name: AI readiness gate (spec)
        run: postman spec ai-readiness postman/specs/cart-service/index.yaml --min-score 70
      - name: AI readiness gate (collection)
        run: postman collection ai-readiness "postman/collections/Cart Service API" --min-score 70
      - name: Push to Postman workspace (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: postman workspace push -y
