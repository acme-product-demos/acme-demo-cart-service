$kind: http-example
name: Cart Reset
request:
  url: "{{baseUrl}}/api/cart"
  method: DELETE
  headers:
    x-user-id: "{{testUserId}}"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "userId": "postman-cli-test-user",
        "items": [],
        "total": 0
      }
order: 1000
