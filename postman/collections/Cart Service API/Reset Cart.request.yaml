$kind: http-request
method: DELETE
url: "{{baseUrl}}/api/cart"
order: 1000
description: Clears the whole cart for the test user first, so this collection can be re-run repeatedly and always start from a known, empty state.
headers:
  x-user-id: "{{testUserId}}"
  x-mock-session: "{{mockSessionId}}"
scripts:
  - type: beforeRequest
    code: "console.log('Starting cart-service scenario for test user: ' + pm.environment.get('testUserId'));"
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('status is 200', function () {
        pm.response.to.have.status(200);
      });

      pm.test('cart is empty after reset', function () {
        const body = pm.response.json();
        pm.expect(body.items.length).to.eql(0);
      });
    language: text/javascript
examples: ./.resources/Reset Cart.resources/examples
