$kind: http-request
method: PUT
url: "{{baseUrl}}/api/cart/items/p1"
order: 6000
description: Sets the p1 line's quantity to exactly 5.
headers:
  x-user-id: "{{testUserId}}"
  x-mock-session: "{{mockSessionId}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "quantity": 5
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', function () {
        pm.response.to.have.status(200);
      });

      pm.test('p1 quantity is now 5', function () {
        const body = pm.response.json();
        const p1 = body.items.find(function (item) { return item.productId === 'p1'; });
        pm.expect(p1).to.not.equal(undefined);
        pm.expect(p1.quantity).to.eql(5);
      });
    language: text/javascript
