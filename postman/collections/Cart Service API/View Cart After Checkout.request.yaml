$kind: http-request
method: GET
url: '{{baseUrl}}/api/cart'
order: 9000
description: Confirms the cart was cleared as a side effect of a successful checkout.
headers:
  - key: x-user-id
    value: '{{testUserId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', function () {
        pm.response.to.have.status(200);
      });

      pm.test('cart is empty after checkout', function () {
        const body = pm.response.json();
        pm.expect(body.items.length).to.eql(0);
      });
