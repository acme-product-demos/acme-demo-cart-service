$kind: http-request
method: POST
url: '{{baseUrl}}/api/cart/checkout'
order: 8000
description: >-
  Real checkout: cart-service calls order-service to create an order from the
  cart's contents, then clears the cart on success.
headers:
  - key: x-user-id
    value: '{{testUserId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 201', function () {
        pm.response.to.have.status(201);
      });

      pm.test('order id is a non-empty string', function () {
        const body = pm.response.json();
        pm.expect(body.id).to.be.a('string');
        pm.expect(body.id.length).to.be.above(0);
      });

      pm.test('order total is 749.95', function () {
        const body = pm.response.json();
        pm.expect(body.total).to.eql(749.95);
      });

      pm.test('order status is confirmed', function () {
        const body = pm.response.json();
        pm.expect(body.status).to.eql('confirmed');
      });
examples: './.resources/Checkout.resources/examples/'
