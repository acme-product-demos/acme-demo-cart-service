$kind: http-request
method: DELETE
url: "{{baseUrl}}/api/cart/items/p3"
order: 7000
description: Removes product p3 entirely, leaving only the headphones line.
headers:
  x-user-id: "{{testUserId}}"
  x-mock-session: "{{mockSessionId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', function () {
        pm.response.to.have.status(200);
      });

      pm.test('cart has exactly one item after removal', function () {
        const body = pm.response.json();
        pm.expect(body.items.length).to.eql(1);
      });
    language: text/javascript
