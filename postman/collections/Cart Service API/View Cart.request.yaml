$kind: http-request
method: GET
url: "{{baseUrl}}/api/cart"
order: 5000
description: Confirms the running total after both items have been added.
headers:
  x-user-id: "{{testUserId}}"
  x-mock-session: "{{mockSessionId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', function () {
        pm.response.to.have.status(200);
      });

      pm.test('cart total is 339.48', function () {
        const body = pm.response.json();
        pm.expect(body.total).to.eql(339.48);
      });
    language: text/javascript
