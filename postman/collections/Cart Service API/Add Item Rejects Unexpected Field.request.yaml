$kind: http-request
method: POST
url: "{{baseUrl}}/api/cart/items"
order: 9500
description: >-
  Self-contained negative test, independent of cart state: a body with an
  unexpected field must be rejected with a clear error, not silently
  accepted.
headers:
  x-user-id: "{{testUserId}}"
  x-mock-session: "{{mockSessionId}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "productId": "p1",
      "quantity": 1,
      "discountCode": "NOT-PART-OF-THE-CONTRACT"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 400', function () {
        pm.response.to.have.status(400);
      });

      pm.test('error names the unexpected field', function () {
        const body = pm.response.json();
        pm.expect(body.error).to.include('discountCode');
      });
    language: text/javascript
